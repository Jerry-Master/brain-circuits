<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Brain Loops 3D</title>
  </head>
  <body>
    <div id="brain-view"></div>

    <nav id="tabs" aria-label="Windows"></nav>

    <header id="hud">
      <button id="btn-hud" title="Collapse / expand" aria-label="Collapse / expand">–</button>
      <div class="eyebrow" id="hud-eyebrow"></div>
      <h1 id="hud-title"></h1>
      <div id="chips"></div>

      <div id="stage-card">
        <svg id="loop-ring" viewBox="0 0 220 220" aria-label="Loop diagram"></svg>
        <div class="stage-meta">
          <div id="stage-num" class="roll"></div>
          <div class="stage-of">of <span id="stage-count"></span></div>
        </div>
      </div>
      <h2 id="stage-title"></h2>
      <p id="stage-desc"></p>

      <div id="transport">
        <button id="btn-play" title="Play / pause (Space)" aria-label="Play / pause">
          <svg viewBox="0 0 16 16"><path id="play-icon" d="M4 3h3v10H4zM9 3h3v10H9z" /></svg>
        </button>
        <div id="pips"></div>
        <button id="btn-step" title="Next phase" aria-label="Next phase">
          <svg viewBox="0 0 16 16"><path d="M3 3l7 5-7 5zM11 3h2v10h-2z" /></svg>
        </button>
      </div>

      <canvas id="inset" hidden></canvas>

      <div id="key"></div>
    </header>

    <div id="touch-tools" aria-label="View controls">
      <button id="tt-collapse" title="Collapse">⊖</button>
      <button id="tt-explode" title="Explode">⊕</button>
      <button id="tt-reset" title="Reset explode">⟲</button>
      <button id="tt-labels" title="Labels">Aa</button>
    </div>

    <div id="hint-touch">Drag: rotate · Two fingers: pan · Pinch: zoom · Tap: info</div>
    <div id="hint">
      Drag: rotate · Right-drag: pan · <b>Wheel: explode / collapse</b> · Shift/Ctrl + wheel or pinch: zoom ·
      Space: play/pause · 1/2/3: window · L: labels · E: reset explode · N: neuron panel
    </div>

    <div id="tooltip" hidden></div>

    <section id="neuron-panel" class="collapsed">
      <div class="panel-head">
        <div>
          <div class="eyebrow">Cellular view</div>
          <span class="title" id="neuron-title"></span>
        </div>
        <div class="cam-buttons">
          <span id="cam-focus"></span>
          <button id="btn-collapse" title="Expand / collapse (N)">+</button>
        </div>
      </div>
      <div class="panel-body">
        <div id="neuron-view"></div>
        <canvas id="scope"></canvas>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
